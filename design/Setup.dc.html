<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kain · Set your budget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#3D3520}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #141210; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #F6F5F1; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141210" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <div style="font-size: 15px; font-weight: 800">Your plan</div>
      <div style="width: 44px"></div>
    </div>

    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2">How much can you spend on food each day?</h1>

    <div style="background: #F6F5F1; border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <div style="font-size: 56px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">₱{{budget}}</div>
        <div style="font-size: 13px; font-weight: 600; color: #6B665C">per day for the whole family</div>
      </div>
      <div style="position: relative; height: 24px">
        <div style="position: absolute; left: 0; right: 0; top: 9px; height: 6px; border-radius: 999px; background: #E2DFD6"></div>
        <div style="position: absolute; left: 0; top: 9px; height: 6px; border-radius: 999px; background: #141210; width: {{fillW}}"></div>
        <div style="position: absolute; top: 0; width: 24px; height: 24px; border-radius: 999px; background: #FFC83A; border: 3px solid #141210; box-sizing: border-box; left: {{knobL}}"></div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: center">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
          <button onClick="{{c.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #E2DFD6; font-family: inherit; font-size: 14px; font-weight: 700; color: #141210; background: {{c.bg}}">₱{{c.v}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 700; color: #6B665C; letter-spacing: 0.02em">Who's eating</div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
        <div style="flex: 1">
          <div style="font-size: 16px; font-weight: 700">Adults and teens</div>
          <div style="font-size: 13px; color: #6B665C">1 serving each</div>
        </div>
        <button onClick="{{adultsDown}}" aria-label="Fewer adults" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #ECEAE4; background: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 600; color: #141210">−</button>
        <div style="width: 28px; text-align: center; font-size: 20px; font-weight: 800">{{adults}}</div>
        <button onClick="{{adultsUp}}" aria-label="More adults" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #141210; font-family: inherit; font-size: 22px; font-weight: 600; color: #FFFFFF">+</button>
      </div>
      <div style="height: 1px; background: #ECEAE4"></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
        <div style="flex: 1">
          <div style="font-size: 16px; font-weight: 700">Kids, 4 to 12</div>
          <div style="font-size: 13px; color: #6B665C">0.6 serving each</div>
        </div>
        <button onClick="{{kidsDown}}" aria-label="Fewer kids" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #ECEAE4; background: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 600; color: #141210">−</button>
        <div style="width: 28px; text-align: center; font-size: 20px; font-weight: 800">{{kids}}</div>
        <button onClick="{{kidsUp}}" aria-label="More kids" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #141210; font-family: inherit; font-size: 22px; font-weight: 600; color: #FFFFFF">+</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 700; color: #6B665C; letter-spacing: 0.02em">Plan for</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F6F5F1; border-radius: 999px">
        <button onClick="{{pickToday}}" style="height: 40px; border-radius: 999px; border: 0; font-family: inherit; font-size: 14px; font-weight: 700; color: #141210; background: {{todayBg}}; box-shadow: {{todayShadow}}">Today</button>
        <button onClick="{{pickWeek}}" style="height: 40px; border-radius: 999px; border: 0; font-family: inherit; font-size: 14px; font-weight: 700; color: #141210; background: {{weekBg}}; box-shadow: {{weekShadow}}">7 days</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <a href="Main.dc.html" style="width: 100%; height: 56px; border-radius: 18px; background: #141210; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 800">
      Build my plan
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC83A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <div style="font-size: 12px; font-weight: 600; color: #6B665C">{{servings}} servings per meal · same inputs, same plan</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { budget: 350, adults: 2, kids: 3, days: 7 };
  }
  renderVals() {
    const s = this.state;
    const pct = Math.max(0, Math.min(1, (s.budget - 150) / 650)) * 100;
    const set = (patch) => () => this.setState(patch);
    return {
      budget: s.budget,
      adults: s.adults,
      kids: s.kids,
      servings: (s.adults + 0.6 * s.kids).toFixed(1),
      fillW: pct.toFixed(1) + '%',
      knobL: 'calc(' + pct.toFixed(1) + '% - 12px)',
      chips: [250, 350, 500].map((v) => ({ v, bg: s.budget === v ? '#FFC83A' : '#FFFFFF', pick: set({ budget: v }) })),
      adultsDown: () => this.setState({ adults: Math.max(1, s.adults - 1) }),
      adultsUp: () => this.setState({ adults: Math.min(10, s.adults + 1) }),
      kidsDown: () => this.setState({ kids: Math.max(0, s.kids - 1) }),
      kidsUp: () => this.setState({ kids: Math.min(10, s.kids + 1) }),
      pickToday: set({ days: 1 }),
      pickWeek: set({ days: 7 }),
      todayBg: s.days === 1 ? '#FFFFFF' : 'transparent',
      weekBg: s.days === 7 ? '#FFFFFF' : 'transparent',
      todayShadow: s.days === 1 ? '0 1px 3px rgba(20,18,16,0.12)' : 'none',
      weekShadow: s.days === 7 ? '0 1px 3px rgba(20,18,16,0.12)' : 'none',
    };
  }
}
</script>
</body>
</html>
