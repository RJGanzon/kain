<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kain · Business plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#141210}a:hover{color:#3D3520}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFC83A; color: #141210; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div style="height: 214px; padding: 16px 20px 0; box-sizing: border-box; display: flex; flex-direction: column">
    <a href="Eatery.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141210" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-bottom: 28px">
      <img src="kain-logo.png" alt="Kain" style="height: 58px; width: auto; display: block">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: #141210; color: #FFC83A; border-radius: 999px; padding: 5px 12px">for Business</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 196px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 26px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2">Protect your margins when market prices move</h1>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em">₱199</span>
        <span style="font-size: 15px; font-weight: 700; color: #6B665C">per month</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{features}}" as="f" hint-placeholder-count="6">
        <div style="display: flex; align-items: flex-start; gap: 12px">
          <span style="width: 24px; height: 24px; border-radius: 999px; background: #E6F4EC; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#14663C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>
          </span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 15px; font-weight: 700; line-height: 1.3">{{f.title}}</div>
            <div style="font-size: 12px; color: #6B665C">{{f.sub}}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
      <div style="font-size: 13px; font-weight: 700; color: #6B665C">Pay with</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{pay}}" as="p" hint-placeholder-count="2">
          <button onClick="{{p.pick}}" style="height: 48px; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800; color: #141210; border: {{p.border}}">{{p.label}}</button>
        </sc-for>
      </div>
      <a href="Eatery.dc.html" style="margin-top: 6px; height: 56px; border-radius: 18px; background: #141210; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800">Start Business plan</a>
      <div style="font-size: 12px; font-weight: 600; color: #6B665C; text-align: center">Cancel anytime. Families always use Kain free.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pay: 'GCash' };
  }
  renderVals() {
    const features = [
      { title: 'Unlimited dish costing', sub: 'Free plan covers 3 dishes' },
      { title: 'Price spike alerts', sub: 'For the ingredients your menu uses' },
      { title: 'Cheaper substitutes', sub: 'Like bangus to tilapia in sinigang' },
      { title: 'Daily profit estimate', sub: 'From your menu and logged purchases' },
      { title: 'Menu cost trend and export', sub: 'Copy your costed menu to Sheets or Excel' },
    ];
    const pay = ['GCash', 'Maya'].map((label) => ({
      label,
      border: this.state.pay === label ? '2px solid #141210' : '1px solid #ECEAE4',
      pick: () => this.setState({ pay: label }),
    }));
    return { features, pay };
  }
}
</script>
</body>
</html>
